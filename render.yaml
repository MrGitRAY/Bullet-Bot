services:
  - type: worker
    name: bullet-bot
    runtime: docker
    plan: 0.5c-512mb
    region: frankfurt
    dockerfilePath: ./docker/Dockerfile
    dockerContext: .
    autoDeployTrigger: commit
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: DATABASE_URL
        value: sqlite+aiosqlite:////app/data/bullet.db
      - key: DEFAULT_LANGUAGE
        value: fa
      - key: TIMEZONE
        value: Asia/Tehran
      - key: LOG_LEVEL
        value: INFO
      - key: ALLOWED_USER_IDS
        sync: false
    disk:
      name: bullet-data
      mountPath: /app/data
      sizeGB: 1
